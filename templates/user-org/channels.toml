# Release channels and promotion rules: canary (agents only), then dev (humans plus agents), then
# stable. No repo ships on a channel yet, so no promotion names a health signal.

[area]
name = "channels"
status = "seed"
schema = "v0"
owners = []
read_by = ["release (P5)", "installer (P5)"]
chromium = "docs/process/release_cycle.md; LUCI promote.py"

[source]
ref = "lkgr"

[[channel]]
name = "canary"
audience = ["agents"]
from = "lkgr"
cadence = "daily"
schedule = "17 6 * * *"  # cron, UTC
unattended = true
[channel.promotion]
approval = "none"
min_soak_hours = 0
min_consecutive_green = 1
health_signals = []

[[channel]]
name = "dev"
audience = ["humans", "agents"]
from = "canary"
cadence = "weekly"
unattended = false
[channel.promotion]
approval = "human-owner"
min_soak_hours = 24
min_consecutive_green = 3
health_signals = []

[[channel]]
name = "stable"
audience = ["everyone"]
from = "dev"
cadence = "biweekly"
unattended = false
[channel.promotion]
approval = "policy-owner"
min_soak_hours = 72
min_consecutive_green = 1
health_signals = []
rollout_percent = [10, 50, 100]
[channel.rollback]
to = "previous"
approval = "human-owner"
