# Builders: what runs, on which trigger, in which pool. `qqcfg add-repo` adds each repo's
# presubmit and postsubmit builders after the line below, which it removes on the first add.
builder = []

[area]
name = "pipelines"
status = "seed"
schema = "v0"
owners = []
read_by = ["gate", "gardener", "tools/qqcfg.py generate"]
chromium = "try and ci builders in infra/config/subprojects/chromium/*.star, generated by lucicfg"

[defaults]
backend = "github"
timeout_minutes = 30
drift_grace_days = 7
timing = "@TIMING@"   # quirq-ai's gate timing step, pinned by commit

[defaults.results]
sink = "@SINK@"   # quirq-ai's result sink, pinned by commit
