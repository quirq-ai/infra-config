# Org-wide policy for @OWNER@: the system's name, execution backends, roles, pools, secret scopes,
# budget and rotations. Written by qqcfg init; quirq infra's defaults, unchanged.

[area]
name = "org"
status = "seed"
schema = "v0"
owners = ["@POLICY_OWNER@"]
read_by = ["gate", "gardener", "release", "rollers"]
chromium = "infra/chromium @chromium-luci library; infradata/config"

[org]
system = "quirq infra"
short = "qq"
code_host = "github.com/@OWNER@"
default_backend = "github"

[[backend]]
name = "github"
status = "active"

[[backend]]
name = "launchpad"
status = "planned"

[roles]
policy-owner = ["@POLICY_OWNER@"]   # approves policy changes and stable promotion

# A pool is a security boundary. Code from an open change never runs where a secret is reachable.
[[pool]]
name = "untrusted"
secrets = []
[pool.github]
runs_on = "ubuntu-24.04"

[[pool]]
name = "trusted"
secrets = ["deploy", "posthog-read"]
[pool.github]
runs_on = "ubuntu-24.04"

[[secret_scope]]
name = "deploy"
mechanism = "oidc"            # short-lived credentials only

[[secret_scope]]
name = "posthog-read"
mechanism = "token"           # read-only; health signals observe, they never act

[budget]
monthly_ci_usd = 0            # 0 means not set

# This org keeps its config in one data-only repo and runs quirq's tools at pinned commits.
[[infra_repo]]
name = "qq-config"
source = "github.com/@OWNER@/qq-config"
visibility = "public"
wave = 1
owns = "This org's qq config (validated and generated by quirq-ai/infra-config's qqcfg) and the pinned infra-config commit."
chromium = "infra/config with lucicfg; infradata/config"
owners = ["@POLICY_OWNER@"]

[[rotation]]
name = "gardener"
duty = "Keep main green: group failures, bisect, revert within auto_revert caps."
members = []

[[rotation]]
name = "roller"
duty = "Move pinned dependencies and toolchains through the gate (rollers.toml)."
members = []

[[rotation]]
name = "release"
duty = "Cut canary daily and prepare promotions for their human approvers (channels.toml)."
members = []
