# Gardener auto-revert caps: at most 10 reverts created per rolling 24 hours, with LUCI Bisection's
# finer limits beneath. qqcfg refuses numbers above these.

[area]
name = "auto_revert"
status = "seed"
schema = "v0"
owners = []
read_by = ["gardener (P4)"]
chromium = "LUCI Bisection; infra/config/luci-bisection.cfg"

[policy]
daily_cap = 10
window_hours = 24
require_culprit_verification = true
only_clean_reverts = true
notify = ["culprit-author", "gardener"]
auto_land_repos = []   # empty: the gardener only proposes reverts. Adding a repo is a policy change.

[build_failure]
create_daily_limit = 10
submit_daily_limit = 4
max_culprit_age_hours = 6

[test_failure]
create_daily_limit = 10
submit_daily_limit = 0
max_culprit_age_hours = 6
