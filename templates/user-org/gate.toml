# The landing gate. A change lands only when the deterministic gate has verified the exact merge
# result. Agents propose; machinery disposes. No agent can override the gate.

[area]
name = "gate"
status = "seed"
schema = "v0"
owners = []
read_by = ["gate (P2)", "repo settings applied by suraj"]
chromium = "LUCI CV and commit-queue.cfg; docs/infra/cq.md"

[merge_queue]
backend = "github"
merge_method = "squash"
required = "blocking-builders"    # every builder with blocking = true is a required check

[admission]
max_p50_minutes = 15
max_minutes = 40
needs_postsubmit_mirror = true

[verification_surface]
# Changes touching these paths need owner approval, and their author cannot approve them.
paths = [
  "tests/**", "**/test_*.py", "**/*.test.ts", "**/*.spec.ts",
  "infra/**", ".github/**", "**/quarantine.*",
]
author_may_approve = false

[[change_class]]
name = "clean-revert"
approval = "none"
matches = "A pure git revert of a landed commit, with no other edits."

[[change_class]]
name = "dependency-roll"
approval = "none"
matches = "Pin and lockfile updates only, opened by the roller rotation."

[[change_class]]
name = "docs"
approval = "none"
matches = "Only Markdown files or docs/**, outside the verification surface."

[[change_class]]
name = "code"
approval = "owner"
matches = "Anything no other class matches."

[[change_class]]
name = "policy"
approval = "policy-owner"
matches = "The verification surface, quarantine lists, release or channel config, and this repo's config/, schema/, tools/ and AGENTS.md."

[tree_status]
closes_on = ["auto-revert-cap-exhausted", "main-red-over-budget"]
