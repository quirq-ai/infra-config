        run: "python -m pytest -q -p no:cacheprovider --junitxml=results/junit.xml"
      - name: "qq result sink"
        if: always() && github.event_name != 'workflow_dispatch'
        uses: quirq-ai/test-pipelines/sink@03dfc5d926aea1183e41ca8fc22c3937468739f6
