name: "qq xo-space-postsubmit"
run-name: "xo-space-postsubmit ${{ inputs.commit || github.sha }}"
on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      commit:
        description: "Main commit to run post-submit on (40-hex SHA)"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: "qq-xo-space-postsubmit-${{ inputs.commit || github.sha }}"
  cancel-in-progress: false
jobs:
  xo-space-postsubmit:
    runs-on: "ubuntu-24.04"
    timeout-minutes: 30
    steps:
      - name: "qq backfill commit check"
        if: github.event_name == 'workflow_dispatch'
        env:
          COMMIT: ${{ inputs.commit }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::commit must be a full 40-character SHA"; exit 1
          fi
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$COMMIT" --jq .status)
          if [ "$status" != behind ] && [ "$status" != identical ]; then
            echo "::error::$COMMIT is not on main (compare status: $status)"; exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: "qq drift check (generated workflows not hand-edited)"
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, sys
          bad = []
          for p in sorted(pathlib.Path(".github/workflows").glob("qq-*.yml")):
              lines = p.read_text().splitlines(keepends=True)
              want = [l[len("# qq-digest: sha256:"):].strip() for l in lines if l.startswith("# qq-digest: sha256:")]
              body = "".join(l for l in lines if not l.startswith("# qq-digest: "))
              if want != [hashlib.sha256(body.encode()).hexdigest()]:
                  bad.append(str(p))
          for p in bad:
              print(f"::error file={p}::{p} was edited by hand. Change quirq-ai/infra-config and redeliver it.")
          sys.exit(1 if bad else 0)
          PY
      - name: "fetch (python-service)"
        run: "python -m pip install --quiet -r requirements.txt"
      - name: "fetch (pytest)"
        run: "python -m pip install --quiet -r requirements-dev.txt"
      - name: "build (python-service)"
        run: "python -m compileall -q ."
