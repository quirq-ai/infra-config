name: "qq innernet-presubmit"
on:
  pull_request:
    branches: ["main"]
  merge_group:
permissions:
  contents: read
  pull-requests: read  # the gate timing step reads the PR timeline
concurrency:
  group: "qq-innernet-presubmit-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  innernet-presubmit:
    runs-on: "ubuntu-24.04"
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: "qq drift check (generated workflows not hand-edited)"
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, sys
          bad = []
          for p in sorted(pathlib.Path(".github/workflows").glob("qq-*.yml")):
              lines = p.read_text().splitlines(keepends=True)
              want = [l[len("# qq-digest: sha256:"):].strip() for l in lines if l.startswith("# qq-digest: sha256:")]
              body = "".join(l for l in lines if not l.startswith("# qq-digest: "))
              if want != [hashlib.sha256(body.encode()).hexdigest()]:
                  bad.append(str(p))
          for p in bad:
              print(f"::error file={p}::{p} was edited by hand. Change quirq-ai/infra-config and redeliver it.")
          sys.exit(1 if bad else 0)
          PY
      - name: "fetch (node-app)"
        run: "npm install --global pnpm@10 && pnpm install --frozen-lockfile"
      - name: "build (node-app)"
        run: "pnpm build"
      - name: "test (node-app)"
        id: "qq-test-node-app"
        run: "pnpm typecheck"
      - name: "qq test report (node-app)"
        if: always() && (steps.qq-test-node-app.outcome == 'success' || steps.qq-test-node-app.outcome == 'failure')
        env:
          OUTCOME: ${{ steps.qq-test-node-app.outcome }}
        run: |
          mkdir -p "$(dirname "results/qq/node-app.xml")"
          if [ "$OUTCOME" = success ]; then
            body=''
          else
            body="<failure message=\"step outcome: $OUTCOME\"/>"
          fi
          printf '<?xml version="1.0" encoding="UTF-8"?>\n<testsuite name="qq" tests="1"><testcase classname="qq" name="test (node-app)">%s</testcase></testsuite>\n' "$body" > "results/qq/node-app.xml"
      - uses: quirq-ai/gate/timing@ce01a4b15f3a7a99d9895c5607c0ce88af67ea5a
        if: github.event_name == 'merge_group'
      - name: "qq result sink"
        if: always()
        uses: quirq-ai/test-pipelines/sink@03dfc5d926aea1183e41ca8fc22c3937468739f6
        with:
          junit: |
            results/qq/node-app.xml
