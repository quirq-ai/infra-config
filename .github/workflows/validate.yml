# This repo's own required check. Hand-written: it checks the config, so it is not generated from it.
# Config changes go through the same gate as code: this runs on every PR and in the merge queue.
name: validate
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install --quiet -r requirements.txt
      - run: python tools/qqcfg.py validate
      - run: python -m unittest discover -s tests -v
