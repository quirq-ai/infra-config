# This repo's own required check. Hand-written: it checks the config, so it is not generated from it.
# Config changes go through the same gate as code: this runs on every PR and in the merge queue.
name: validate
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
      - run: python -m pip install --quiet -r requirements.txt
      - run: python tools/qqcfg.py validate
      - run: python -m unittest discover -s tests -v
