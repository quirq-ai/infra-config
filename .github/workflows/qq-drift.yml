# Hand-written, like validate.yml. Meant to run as an organization-required workflow (an org
# ruleset, "Require workflows to pass before merging", pointing at this file on main) in every repo
# listed in config/repos.toml. A PR in a product repo cannot edit this file, so a hand-edited,
# renamed or deleted qq-*.yml stub fails it (V0-CFG-02). Repos with nothing delivered pass, and so
# do PRs into other branches than the repo's default. While a PR leaves the qq-* files alone, stubs
# main generated within pipelines.toml drift_grace_days still pass, with a warning to redeliver.
# It runs qqcfg and reads config from the infra-config commit the ruleset pins (github.workflow_sha),
# never from whatever main is at run time (audit F2): a change here takes effect when gate moves the
# pin, so merge infra-config, have gate repin, then redeliver. Actions are pinned by commit.
name: qq-drift
on:
  pull_request:
    # edited: a PR retargeted from another branch to the default one is checked again.
    types: [opened, synchronize, reopened, edited]
  merge_group:
permissions:
  contents: read
jobs:
  qq-drift:
    # Nothing is delivered to infra-config, and its own PRs test check-delivered in validate's unit
    # tests. Running here would also use main's qqcfg, which predates a PR's changes.
    if: github.repository != 'quirq-ai/infra-config'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: refuse a run that is not this file from quirq-ai/infra-config
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          case "$WORKFLOW_REF" in
            quirq-ai/infra-config/.github/workflows/qq-drift.yml@*) ;;
            *) echo "::error::qq-drift must run from quirq-ai/infra-config, not $WORKFLOW_REF"; exit 1 ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: target
          fetch-depth: 0        # the base commit too, to see whether the change edits qq-* files
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: quirq-ai/infra-config
          ref: ${{ github.workflow_sha }}   # the pinned commit; a SHA from elsewhere fails to check out
          path: infra-config
          fetch-depth: 0        # --history reads stubs main generated within drift_grace_days
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
      - run: python -m pip install --quiet -r infra-config/requirements.txt
      - name: compare delivered stubs with the pinned infra-config
        env:
          REPO: ${{ github.event.repository.name }}
          # Stubs live on the default branch only; PRs into other branches (xo-space's development) pass.
          BASE: ${{ github.base_ref || github.event.merge_group.base_ref }}
          # merge_group: the group's base. pull_request: empty, so HEAD^1, the base side of the merge ref.
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: >-
          python infra-config/tools/qqcfg.py check-delivered "$REPO" target
          --base "$BASE" --base-sha "$BASE_SHA" --history
