# GENERATED by qqcfg (tools/qqcfg.py generate) from quirq-ai/infra-config. Do not edit by hand.
# Source: config/pipelines.toml builder "website-presubmit". The job name is the required check.
# qq-digest: sha256:7da5a0c174403b143262535108fa23a21b9b22f3dc0300f3a155e987e87ed287
name: "qq website-presubmit"
on:
  pull_request:
    branches: ["main"]
  merge_group:
permissions:
  contents: read
  pull-requests: read  # the gate timing step reads the PR timeline
concurrency:
  group: "qq-website-presubmit-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  website-presubmit:
    runs-on: "ubuntu-24.04"
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - name: "qq drift check (generated workflows not hand-edited)"
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, sys
          bad = []
          for p in sorted(pathlib.Path(".github/workflows").glob("qq-*.yml")):
              lines = p.read_text().splitlines(keepends=True)
              want = [l[len("# qq-digest: sha256:"):].strip() for l in lines if l.startswith("# qq-digest: sha256:")]
              body = "".join(l for l in lines if not l.startswith("# qq-digest: "))
              if want != [hashlib.sha256(body.encode()).hexdigest()]:
                  bad.append(str(p))
          for p in bad:
              print(f"::error file={p}::{p} was edited by hand. Change quirq-ai/infra-config and redeliver it.")
          sys.exit(1 if bad else 0)
          PY
      - name: "fetch (gatsby-site)"
        run: "npm install --global pnpm@10 && pnpm install --frozen-lockfile"
      - name: "build (gatsby-site)"
        run: "GATSBY_TELEMETRY_DISABLED=1 GATSBY_CPU_COUNT=2 NODE_OPTIONS=--max-old-space-size=6144 pnpm build"
      - name: "test (gatsby-site)"
        id: "qq-test-gatsby-site"
        run: "pnpm test"
      - name: "qq test report (gatsby-site)"
        if: always() && (steps.qq-test-gatsby-site.outcome == 'success' || steps.qq-test-gatsby-site.outcome == 'failure')
        env:
          OUTCOME: ${{ steps.qq-test-gatsby-site.outcome }}
        run: |
          mkdir -p "$(dirname "results/qq/gatsby-site.xml")"
          if [ "$OUTCOME" = success ]; then
            body=''
          else
            body="<failure message=\"step outcome: $OUTCOME\"/>"
          fi
          printf '<?xml version="1.0" encoding="UTF-8"?>\n<testsuite name="qq" tests="1"><testcase classname="qq" name="test (gatsby-site)">%s</testcase></testsuite>\n' "$body" > "results/qq/gatsby-site.xml"
      - uses: quirq-ai/gate/timing@7a4fb535d936b51cdcc8b66e8004e5609b4ee6a4
        if: always() && github.event_name == 'merge_group'
        timeout-minutes: 3
        continue-on-error: true
      - name: "qq result sink"
        if: always()
        uses: quirq-ai/test-pipelines/sink@28f49a0a5bbe620c3419d7b859ae896e6ded4fa9
        with:
          junit: |
            results/qq/gatsby-site.xml
