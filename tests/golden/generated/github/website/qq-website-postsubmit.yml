# GENERATED by qqcfg (tools/qqcfg.py generate) from quirq-ai/infra-config. Do not edit by hand.
# Source: config/pipelines.toml builder "website-postsubmit". The job name is the required check.
# qq-digest: sha256:76b6235767fb8f508a7a0bf9808046bb166a3ccce17304426a40e2a202cfe162
name: "qq website-postsubmit"
run-name: "website-postsubmit ${{ inputs.commit || github.sha }}"
on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      commit:
        description: "Main commit to run post-submit on (40-hex SHA)"
        required: true
        type: string
permissions:
  contents: read
jobs:
  website-postsubmit:
    runs-on: "ubuntu-24.04"
    timeout-minutes: 30
    steps:
      - name: "qq backfill commit check"
        id: qq-backfill
        if: github.event_name == 'workflow_dispatch'
        env:
          COMMIT: ${{ inputs.commit }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::dispatch backfills from main, not $GITHUB_REF"; exit 1
          fi
          if ! [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::commit must be a full 40-character SHA"; exit 1
          fi
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$COMMIT" --jq .status)
          if [ "$status" != behind ] && [ "$status" != identical ]; then
            echo "::error::$COMMIT is not on main (compare status: $status)"; exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.commit || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - name: "qq drift check (generated workflows not hand-edited)"
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, sys
          bad = []
          for p in sorted(pathlib.Path(".github/workflows").glob("qq-*.yml")):
              lines = p.read_text().splitlines(keepends=True)
              want = [l[len("# qq-digest: sha256:"):].strip() for l in lines if l.startswith("# qq-digest: sha256:")]
              body = "".join(l for l in lines if not l.startswith("# qq-digest: "))
              if want != [hashlib.sha256(body.encode()).hexdigest()]:
                  bad.append(str(p))
          for p in bad:
              print(f"::error file={p}::{p} was edited by hand. Change quirq-ai/infra-config and redeliver it.")
          sys.exit(1 if bad else 0)
          PY
      - name: "fetch (gatsby-site)"
        run: "npm install --global pnpm@10 && pnpm install --frozen-lockfile"
      - name: "build (gatsby-site)"
        run: "GATSBY_TELEMETRY_DISABLED=1 GATSBY_CPU_COUNT=2 NODE_OPTIONS=--max-old-space-size=6144 pnpm build"
      - name: "test (gatsby-site)"
        id: "qq-test-gatsby-site"
        run: "pnpm test"
      - name: "qq test report (gatsby-site)"
        if: always() && (steps.qq-test-gatsby-site.outcome == 'success' || steps.qq-test-gatsby-site.outcome == 'failure')
        env:
          OUTCOME: ${{ steps.qq-test-gatsby-site.outcome }}
        run: |
          mkdir -p "$(dirname "results/qq/gatsby-site.xml")"
          if [ "$OUTCOME" = success ]; then
            body=''
          else
            body="<failure message=\"step outcome: $OUTCOME\"/>"
          fi
          printf '<?xml version="1.0" encoding="UTF-8"?>\n<testsuite name="qq" tests="1"><testcase classname="qq" name="test (gatsby-site)">%s</testcase></testsuite>\n' "$body" > "results/qq/gatsby-site.xml"
      - name: "qq result sink"
        if: always() && (github.event_name != 'workflow_dispatch' || steps.qq-backfill.outcome == 'success')
        uses: quirq-ai/test-pipelines/sink@28f49a0a5bbe620c3419d7b859ae896e6ded4fa9
        with:
          junit: |
            results/qq/gatsby-site.xml
          commit: ${{ inputs.commit || github.sha }}
          kind: postsubmit
