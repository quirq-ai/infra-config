# Builders: what runs, on which trigger, in which pool. Pipelines follow Chromium's split:
# presubmit (on the change, inside the gate), postsubmit (every main commit), release, and perf
# (perf.toml). Fuzz schedules live in fuzz.toml.
# Triggers are backend-neutral; the github backend maps them when it generates workflows:
#   change   -> a proposed change (GitHub pull_request)
#   queue    -> the exact merge result inside the gate (GitHub merge_group)
#   land     -> a commit landing on the default branch (GitHub push)
#   schedule -> a timer; release builders take theirs from channels.toml

[area]
name = "pipelines"
status = "seed"
schema = "v0"
owners = []            # suraj fills in
read_by = ["gate", "gardener", "tools/qqcfg.py generate"]
chromium = "try and ci builders in infra/config/subprojects/chromium/*.star, generated by lucicfg"

# Every builder lives here; each repo keeps only its manifest (plan D15, decided 2026-10-03).
# Chromium keeps them in the tree they build (chromium/src/infra/config).

[defaults]
backend = "github"            # v0; Launchpad later (org.toml backends)
timeout_minutes = 30

# --- xo-space -------------------------------------------------------------------------------

[[builder]]
name = "xo-space-presubmit"
repo = "xo-space"
pipeline = "presubmit"
triggers = ["change", "queue"]
kinds = ["python-service", "pytest"]
capabilities = ["fetch", "build", "test"]
pool = "untrusted"
blocking = true          # a required check in the landing gate
timeout_minutes = 20
generate = true          # the one builder tools/qqcfg.py generate renders today
# It runs only install, compileall and pytest. xo-space's hand-written tests.yml also runs route
# parity, the install/uninstall harnesses, plugin sync and Space UI syntax checks, so tests.yml stays
# a required check until the repo's manifest targets cover those.

[[builder]]
name = "xo-space-postsubmit"
repo = "xo-space"
pipeline = "postsubmit"
triggers = ["land"]
kinds = ["python-service", "pytest"]
capabilities = ["fetch", "build", "test"]
pool = "trusted"
cancel_in_progress = false   # every main commit gets a verdict, so culprits stay findable

[[builder]]
name = "xo-space-canary-deploy"
repo = "xo-space"
pipeline = "release"
triggers = ["schedule"]
channel = "canary"
kinds = ["python-service"]
capabilities = ["deploy"]   # moves the canary channel ref that the installer will follow
pool = "trusted"

# --- innernet -------------------------------------------------------------------------------

[[builder]]
name = "innernet-presubmit"
repo = "innernet"
pipeline = "presubmit"
triggers = ["change", "queue"]
kinds = ["node-app"]
capabilities = ["fetch", "build", "test"]   # innernet has no tests yet; `test` is typecheck until it does
pool = "untrusted"
blocking = true
timeout_minutes = 20

[[builder]]
name = "innernet-postsubmit"
repo = "innernet"
pipeline = "postsubmit"
triggers = ["land"]
kinds = ["node-app"]
capabilities = ["fetch", "build", "test"]
pool = "trusted"
cancel_in_progress = false

[[builder]]
name = "innernet-canary-deploy"
repo = "innernet"
pipeline = "release"
triggers = ["schedule"]
channel = "canary"
kinds = ["node-app"]
capabilities = ["deploy"]
pool = "trusted"
