# The registry of onboarded repos. Onboarding a repo means adding one [[repo]] block here, plus
# the repo's own infra/repo.toml once `sync` exists. Facts were read from the repos on 2026-10-03.
# Settled: public repos only for now (both repos below clone anonymously).

[area]
name = "repos"
status = "seed"
schema = "v0"
owners = []            # suraj fills in
read_by = ["gate", "gardener", "release", "rollers"]
chromium = "projects and refs declared in infra/config (lucicfg)"

[[repo]]
name = "xo-space"
source = "github.com/quirq-ai/xo-space"
description = "Python FastAPI app (cowork API and Space UI) that users install on their machines."
visibility = "public"
default_branch = "main"
kinds = ["python-service", "pytest"]
manifest = "infra/repo.toml"   # not created yet (P1)
channels = ["canary", "dev", "stable"]
owners = []              # suraj fills in
[repo.deploy]
target = "installer-channel"   # install.sh and the in-app updater follow a channel ref (P5); today they follow main
# xo-space runs Python 3.12 today (Dockerfile, tests.yml); moving to the org pin is P1 work.
# It also publishes a container image to ghcr; containers stay out of scope until later.
# qq-*.yml files another quirq tool delivers (not qqcfg). qq-drift requires each to match its digest
# (sha256 of the file's bytes) when present, so a reviewed product PR cannot weaken it unnoticed;
# its owner bumps the digest here when it redelivers.
[[repo.other_qq_workflows]]
file = "qq-roll-land.yml"
from = "quirq-ai/rollers"   # V0-ROL-02; xo-space #219, from rollers a6e6ed9 (ROL-R6)
sha256 = "5a3da13cb21960bdce63ff45ac7d7927eb4b03c02c130a020f4fe24909b2ecf7"

[[repo]]
name = "innernet"
source = "github.com/quirq-ai/innernet"
description = "Next.js app managed with pnpm."
visibility = "public"
default_branch = "main"
kinds = ["node-app"]
manifest = "infra/repo.toml"   # not created yet (P1)
channels = ["canary", "dev", "stable"]
owners = []              # suraj fills in
[repo.deploy]
target = "vercel"        # TODO(expert): verify Vercel (only a .vercelignore hints).
[[repo.other_qq_workflows]]
file = "qq-roll-land.yml"
from = "quirq-ai/rollers"   # V0-ROL-02; innernet #38 at 8ef3653, from rollers a6e6ed9 (ROL-R6)
sha256 = "2e7110c455c94e390afd18ad4168c17b671ed09a10f10977135f5bc42c60c612"
