# Rotations are seats. suraj fills `members` with people or agents.
[[rotation]]
name = "gardener"
duty = "Keep main green: group failures, bisect, revert within auto_revert caps."
members = []

[[rotation]]
name = "roller"
duty = "Move pinned dependencies and toolchains through the gate (rollers.toml)."
members = []

[[rotation]]
name = "release"
duty = "Cut canary daily and prepare promotions for their human approvers (channels.toml)."
members = []
